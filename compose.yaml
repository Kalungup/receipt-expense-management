services:

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: receipt-n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Stockholm
      - TZ=Europe/Stockholm
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  ocr-service:
    build:
      context: ./ocr-service
    container_name: receipt-ocr
    ports:
      - "8001:8000"
    restart: unless-stopped

volumes:
  n8n_data: